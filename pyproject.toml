[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "durbl-sdk"
version = "0.2.4"
description = "Official Python client for the Durbl memory engine"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Durbl Team", email = "team@durbl.dev" },
]
keywords = ["ai", "memory", "agents", "sdk", "durbl", "llm", "context"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-httpx>=0.35.0",
    "ruff>=0.7.0",
]

[project.urls]
Homepage = "https://durbl.dev"
Documentation = "https://docs.durbl.dev"
Source = "https://github.com/durbl-ai/durbl"
Issues = "https://github.com/durbl-ai/durbl/issues"
Changelog = "https://github.com/durbl-ai/durbl/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["durbl_sdk"]

[tool.hatch.build.targets.sdist]
include = [
    "/durbl_sdk",
    "/README.md",
    "/CHANGELOG.md",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
