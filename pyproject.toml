[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "durbl-sdk"
version = "0.1.0"
description = "Python SDK for the Durbl memory engine"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Durbl Team" },
]
keywords = ["ai", "memory", "agents", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[project.urls]
Homepage = "https://durbl.dev"
Documentation = "https://durbl.dev/docs"
Repository = "https://github.com/durbl-ai/durbl"
Issues = "https://github.com/durbl-ai/durbl/issues"

[tool.hatch.build.targets.wheel]
packages = ["durbl_sdk"]
